[project]
name = "freds-oral-prep-utils"
requires-python = ">=3.13"
dependencies = [
    "click (>=8.5.0,<9.0.0)",
    "anki (>=26.9.4,<27.0.0)",
    "pdfplumber (>=0.11.10,<0.12.0)",
    "bs4 (>=0.0.2,<0.0.3)",
    "requests (>=2.34.2,<3.0.0)",
    "wikitextparser (>=3.0.0,<4.0.0)",
    "anki-drag-and-drop @ git+https://github.com/DamianZaremba/anki-drag-and-drop.git",
    "anki-multiple-choice @ git+https://github.com/DamianZaremba/anki-multiple-choice.git",
    "anki-ordering @ git+https://github.com/DamianZaremba/anki-ordering.git",
    "anki-dynamic-image @ git+https://github.com/DamianZaremba/anki-dynamic-image.git",
]

[project.scripts]
fred-oral-prep = "cli:cli"

[tool.poetry]
package-mode = false

[tool.poetry.group.test.dependencies]
tox = "^4.67.12"
tox-current-env = "^0.0.17"
black = "^26.10.1"
ruff = "^0.17.4"
bandit = "^1.9.4"

[tool.ruff]
line-length = 120

[tool.black]
line-length = 120

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
